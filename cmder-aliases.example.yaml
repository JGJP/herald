# Copy to cmder-aliases.yaml (gitignored). Maps a short label to a repo path, so a
# header in cmder-control can be just the label instead of the full path. `~`
# expands to your home dir. A header that isn't a listed alias falls back to the
# usual rules (a path anywhere, or a bare name → ~/_dev/<name>).
superapp: ~/_dev/_startale/superapp
infra: ~/work/infra-monorepo
